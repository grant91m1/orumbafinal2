<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/images/favicon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/apple-touch-icon.png">
    <meta name="theme-color" content="#231f20">
    <meta name="description" content="Official announcements and press releases from Orumba North LGA.">
    <title>Announcements | Orumba North LGA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/global-theme.css">
    <link rel="stylesheet" href="/static/css/navbar.css">
    <link rel="stylesheet" href="/static/css/mobile-global.css">
    <style>

        .announcement-card {
            padding: 2rem;
            border-left: 4px solid var(--color-green-500);
            height: 100%;
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
        }
        .announcement-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
        }
        .announcement-card .date {
            color: var(--color-gray-500);
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
        }
        .announcement-card h3 {
            font-size: var(--text-lg);
            color: var(--color-gray-900);
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }
        .announcement-card p {
            color: var(--color-gray-600);
            line-height: 1.6;
            font-size: var(--text-base);
        }

        @media (max-width: 768px) {
            .announcement-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    {% include '_header.html' %}

    <section class="page-banner" style="background-image: url('/static/images/orumba-header-bakground-image3.jpg');">
        <div class="container">
            <h1>Announcements</h1>
            <p>Official announcements, public notices, and press releases from Orumba North Local Government.</p>
        </div>
    </section>

    <section class="section-padding" style="background: var(--color-slate-50);">
        <div class="container">
            <div class="grid-responsive-2" id="announcements-grid">
                <div class="announcement-card" role="status">Loading current announcements...</div>
            </div>
        </div>
    </section>

    {% include '_footer.html' %}
    <script>
        async function loadAnnouncements() {
            const grid = document.getElementById('announcements-grid');
            try {
                const response = await fetch('/api/public/posts');
                const data = await response.json();
                if (!response.ok || data.status !== 'success' || !Array.isArray(data.posts)) {
                    throw new Error('Unable to load announcements.');
                }
                if (!data.posts.length) {
                    grid.textContent = '';
                    const emptyState = document.createElement('div');
                    emptyState.className = 'announcement-card';
                    emptyState.textContent = 'No current announcements are available. Please check back soon.';
                    grid.appendChild(emptyState);
                    return;
                }

                grid.textContent = '';
                data.posts.forEach(post => {
                    const card = document.createElement('article');
                    card.className = 'announcement-card';
                    const date = document.createElement('div');
                    date.className = 'date';
                    date.textContent = new Date(post.published_at || post.created_at || Date.now()).toLocaleDateString();
                    const title = document.createElement('h3');
                    title.textContent = post.title || 'Announcement';
                    const content = document.createElement('p');
                    const parsed = new DOMParser().parseFromString(post.content || '', 'text/html');
                    content.textContent = parsed.body.textContent.trim() || 'See the newsroom for details.';
                    const link = document.createElement('a');
                    link.className = 'read-more';
                    link.href = `/post/${encodeURIComponent(post.id)}`;
                    link.textContent = 'Read More';
                    card.append(date, title, content, link);
                    grid.appendChild(card);
                });
            } catch (error) {
                grid.textContent = '';
                const errorState = document.createElement('div');
                errorState.className = 'announcement-card';
                errorState.setAttribute('role', 'alert');
                errorState.textContent = 'Announcements are temporarily unavailable. Please try again later.';
                grid.appendChild(errorState);
                console.error('Failed to load announcements:', error);
            }
        }
        window.addEventListener('load', loadAnnouncements);
    </script>
</body>
</html>
