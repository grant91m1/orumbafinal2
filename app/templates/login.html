<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/images/favicon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/apple-touch-icon.png">
    <meta name="theme-color" content="#231f20">
    <meta name="robots" content="noindex">
    <meta name="description" content="Login to your Orumba North LGA account.">
    <title>Writer Sign In | Orumba North LGA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/global-theme.css">
    <link rel="stylesheet" href="/static/css/navbar.css">
    <link rel="stylesheet" href="/static/css/mobile-global.css">
    <style>
        body {
            background: linear-gradient(135deg, var(--color-navy-900) 0%, var(--color-navy-800) 50%, var(--color-navy-700) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            font-family: 'Inter', sans-serif;
        }
        .login-container {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
        }
        h1 {
            color: var(--color-white);
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: var(--text-2xl);
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .intro { color: var(--color-slate-200); text-align: center; font-size: 0.92rem; line-height: 1.55; margin: 0 0 1.5rem; }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--color-slate-200);
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 0.875rem 1rem;
            margin-bottom: 1.25rem;
            border-radius: var(--radius);
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255, 255, 255, 0.96);
            font-size: 16px;
            color: var(--color-gray-900);
            font-family: 'Inter', sans-serif;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: var(--color-green-500);
            box-shadow: 0 0 0 3px rgba(34,197,94,0.2);
        }
        input::placeholder { color: var(--color-gray-900); opacity: 1; }
        button[type="submit"] {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, var(--color-green-500), var(--color-green-600));
            border: none;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(34,197,94,0.3);
            font-family: 'Inter', sans-serif;
        }
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(34,197,94,0.4);
        }
        .message {
            margin-top: 1rem;
            text-align: center;
            font-weight: 600;
            min-height: 1.5rem;
        }
        .link {
            margin-top: 1.5rem;
            text-align: center;
        }
        .link a {
            color: var(--color-green-500);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        .link a:hover { color: var(--color-green-400); text-decoration: underline; }
        .link p { color: var(--color-slate-200); margin: 0; font-size: 0.9rem; }

        @media (max-width: 480px) {
            .login-container { padding: 2rem 1.5rem; }
            h1 { font-size: var(--text-xl); }
        }
    </style>
</head>
<body>
    <div class="login-container" role="main" aria-labelledby="login-title">
        <h1 id="login-title">Writer Sign In</h1>
        <p class="intro">For authorised council writers who publish news, photo albums and upcoming events.</p>
        <form id="login-form" aria-describedby="login-message">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter your username" />
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password" />
            <button type="submit">Log In</button>
            <div id="login-message" class="message" role="alert" aria-live="assertive"></div>
        </form>
        <div class="link">
            <p>Writer accounts are issued by the council. <a href="/writers/register">Create an account with an invite code</a></p>
            <p style="margin-top: 0.75rem;"><a href="/">&larr; Back to the website</a></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const messageDiv = document.getElementById('login-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageDiv.textContent = '';
            messageDiv.style.color = '';
            const username = form.username.value.trim();
            const password = form.password.value.trim();

            if (!username || !password) {
                messageDiv.style.color = '#f87171';
                messageDiv.textContent = 'Please enter both username and password.';
                return;
            }

            try {
                const csrfToken = document.querySelector('input[name="csrf_token"]').value;
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    messageDiv.style.color = '#4ade80';
                    messageDiv.textContent = 'Login successful! Redirecting...';
                    setTimeout(() => { window.location.href = '/profile'; }, 1000);
                } else {
                    messageDiv.style.color = '#f87171';
                    messageDiv.textContent = data.message || 'Login failed.';
                }
            } catch (error) {
                messageDiv.style.color = '#f87171';
                messageDiv.textContent = 'An error occurred. Please try again.';
            }
        });
    </script>
</body>
</html>
