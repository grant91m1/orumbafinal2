<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/images/favicon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/apple-touch-icon.png">
    <meta name="theme-color" content="#231f20">
    <meta name="description" content="Members and elected officials of Orumba North Local Government Area Congress of Councilors.">
    <title>Members | Orumba North LGA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/global-theme.css">
    <link rel="stylesheet" href="/static/css/navbar.css">
    <link rel="stylesheet" href="/static/css/mobile-global.css">
</head>
<body>
    {% from '_people.html' import person_card %}
    {% include '_header.html' %}

    <section class="page-banner" style="background-image: url('/static/images/orumba-header-bakground-image3.jpg');">
        <div class="container">
            <span class="page-banner-eyebrow">Legislative Council</span>
            <h1>Members of Orumba North</h1>
            <p>The elected ward councillors representing communities across Orumba North.</p>
        </div>
    </section>

    <main class="section-padding">
        <div class="container">
            <div class="people-grid">
                {% for key in councillors %}
                {{ person_card(key) }}
                {% endfor %}
            </div>
        </div>
    </main>

    {% include '_footer.html' %}

</body>
</html>
